service: biztechApi-bots
org: ianmh
app: biztechapp

frameworkVersion: "^4.0.0"

build:
  esbuild: false

plugins:
  - serverless-dynamodb
  - serverless-offline
  - serverless-domain-manager
  - serverless-esbuild
  - serverless-mocha-plugin

provider:
  name: aws
  stage: ${file(../../serverless.common.yml):provider.stage}
  runtime: ${file(../../serverless.common.yml):provider.runtime}
  region: ${file(../../serverless.common.yml):provider.region}
  environment:
    ENVIRONMENT: ${file(../../config.${self:provider.stage}.json):ENVIRONMENT}
    NODE_ENV: ${env:NODE_ENV}
    DISCORD_PUBLIC_KEY: ${env:DISCORD_PUBLIC_KEY,""}
    DISCORD_PUBLIC_KEY_PROD: ${env:DISCORD_PUBLIC_KEY_PROD,""}
    DISCORD_TOKEN: ${env:DISCORD_TOKEN,""}
    DISCORD_TOKEN_PROD: ${env:DISCORD_TOKEN_PROD,""}
    GH_CLIENT_ID: ${env:GH_CLIENT_ID,""}
    GH_PRIVATE_KEY: ${env:GH_PRIVATE_KEY,""}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY,""}
    OPENAI_DOCS_MODEL: ${env:OPENAI_DOCS_MODEL,"gpt-5.4-mini"}
    DOCS_INDEX_S3_BUCKET: ${env:DOCS_INDEX_S3_BUCKET,"biztech-docs-index"}
    DOCS_INDEX_S3_KEY: ${env:DOCS_INDEX_S3_KEY,"slack-docs-index/latest.json"}
    DOCS_INDEX_S3_REGION: ${env:DOCS_INDEX_S3_REGION, self:provider.region}
    DOCS_INDEX_REFRESH_SECONDS: ${env:DOCS_INDEX_REFRESH_SECONDS,"300"}
    DOCS_INDEX_ERROR_RETRY_SECONDS: ${env:DOCS_INDEX_ERROR_RETRY_SECONDS,"30"}
    DOCS_INDEX_MAX_BYTES: ${env:DOCS_INDEX_MAX_BYTES,"8388608"}
    SLACK_BOT_TOKEN: ${env:SLACK_BOT_TOKEN,""}
    SLACK_BOT_USER_ID: ${env:SLACK_BOT_USER_ID,""}
  timeout: 15 # in seconds

  apiGateway:
    restApiId: !ImportValue ${self:provider.stage}-ExtApiGatewayRestApiId
    restApiRootResourceId: !ImportValue ${self:provider.stage}-ExtApiGatewayRestApiRootResourceId
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:Scan
      Resource:
        - "arn:aws:dynamodb:us-west-2:432714361962:table/biztechMembers2025${self:provider.environment.ENVIRONMENT}"
        - "arn:aws:dynamodb:us-west-2:432714361962:table/biztechMembers2026${self:provider.environment.ENVIRONMENT}"
        - "arn:aws:dynamodb:us-west-2:432714361962:table/biztechMembers2027${self:provider.environment.ENVIRONMENT}"
        - "arn:aws:dynamodb:us-west-2:432714361962:table/storyPoints${self:provider.environment.ENVIRONMENT}"
    - Effect: Allow
      Action:
        - s3:GetObject
      Resource:
        - 'arn:aws:s3:::${env:DOCS_INDEX_S3_BUCKET, "biztech-docs-index"}/*'
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:biztechApi-bots-${self:provider.stage}-slackShortcutEventHandler"

custom:
  prune: ${file(../../serverless.common.yml):custom.prune}
  bundle: ${file(../../serverless.common.yml):custom.bundle}
  serverless-offline: ${file(../../serverless.common.yml):custom.serverless-offline}
  serverless-mocha-plugin: ${file(../../serverless.common.yml):custom.serverless-mocha-plugin}
  stage: ${file(../../serverless.common.yml):custom.stage}
  domains: ${file(../../serverless.common.yml):custom.domains}
  customDomain: ${file(../../serverless.common.yml):custom.customDomain}
  environment: ${file(../../config.${self:provider.stage}.json):ENVIRONMENT}
  slackEnabled: ${self:custom.slackEnabledMap.${self:custom.environment}, true}
  slackEnabledMap:
    PROD: false

functions:
  discordInteractions:
    handler: handlerDiscord.interactions
    events:
      - http:
          path: discord/interactions
          method: post
          cors: true

  discordAccountMapping:
    handler: handlerDiscord.mapDiscordAccountToMembership
    events:
      - http:
          path: discord/account/mapping
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  discordWebhook:
    handler: handlerDiscord.webhook
    events:
      - http:
          path: discord/webhook
          method: post
          cors: true

  slackGithubReminder:
    handler: handlerSlack.slackGithubReminder
    events:
      - http:
          path: slack/github
          method: post
          cors: true
      - schedule:
          rate: cron(0 17 ? * 1 *)
          enabled: ${self:custom.slackEnabled}
      - schedule:
          rate: cron(0 17 ? * 5 *)
          enabled: ${self:custom.slackEnabled}

  slackShortcutEventHandler:
    handler: handlerSlack.shortcutHandler
    events:
      - http:
          path: slack/shortcut/events
          method: post
          cors: true
