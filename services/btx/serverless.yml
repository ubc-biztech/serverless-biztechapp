# services/btx/serverless.yml

service: biztechApi-btx
app: biztechapp

frameworkVersion: "^4.0.0"

build:
  esbuild: false

plugins:
  - serverless-dynamodb
  - serverless-offline
  - serverless-domain-manager
  - serverless-esbuild

provider:
  name: aws
  stage: ${file(../../serverless.common.yml):provider.stage}
  region: ${file(../../serverless.common.yml):provider.region}
  runtime: ${file(../../serverless.common.yml):provider.runtime}
  timeout: 15

  environment:
    ENVIRONMENT: ${file(../../config.${self:provider.stage}.json):ENVIRONMENT}
    NODE_ENV: ${env:NODE_ENV}
    KICKSTART_EVENT_KEY: ${file(../../config.${self:provider.stage}.json):KICKSTART_EVENT_KEY}
    KICKSTART_EVENT_ENDS_AT: ${file(../../config.${self:provider.stage}.json):KICKSTART_EVENT_ENDS_AT}
    BTX_TRADE_QUEUE_URL:
      Ref: BtxTradeCommandsQueue
    WS_API_ENDPOINT:
      Fn::Join:
        - ""
        - - "https://"
          - Ref: WebsocketsApi
          - ".execute-api."
          - Ref: AWS::Region
          - "."
          - Ref: AWS::URLSuffix
          - "/${self:provider.stage}"

  apiGateway:
    restApiId: !ImportValue ${self:provider.stage}-ExtApiGatewayRestApiId
    restApiRootResourceId: !ImportValue ${self:provider.stage}-ExtApiGatewayRestApiRootResourceId

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:DeleteItem
        - dynamodb:TransactWriteItems
        - dynamodb:ConditionCheckItem
      Resource:
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxProjects${self:provider.environment.ENVIRONMENT}
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxProjects${self:provider.environment.ENVIRONMENT}/index/byEvent
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxEventAccounts${self:provider.environment.ENVIRONMENT}
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxEventAccounts${self:provider.environment.ENVIRONMENT}/index/byEvent
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxHoldings${self:provider.environment.ENVIRONMENT}
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxHoldings${self:provider.environment.ENVIRONMENT}/index/byProject
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxTrades${self:provider.environment.ENVIRONMENT}
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxTrades${self:provider.environment.ENVIRONMENT}/index/byAccount
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxSockets${self:provider.environment.ENVIRONMENT}
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxSockets${self:provider.environment.ENVIRONMENT}/index/byEvent
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxSockets${self:provider.environment.ENVIRONMENT}/index/byUser
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/bizBtxPrices${self:provider.environment.ENVIRONMENT}

    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:ConditionCheckItem
      Resource:
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/biztechTeams${self:provider.environment.ENVIRONMENT}
        - arn:aws:dynamodb:us-west-2:${aws:accountId}:table/biztechRegistrations${self:provider.environment.ENVIRONMENT}

    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - Fn::GetAtt: [BtxTradeCommandsQueue, Arn]

    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - arn:aws:execute-api:${self:provider.region}:${aws:accountId}:*/${self:provider.stage}/@connections/*

custom:
  esbuild:
    # Bundle the existing SDK's SQS client; Node 22 Lambda does not provide SDK v2.
    exclude: []

  prune:
    automatic: true
    number: 3

  bundle:
    sourcemaps: false

  stage: ${opt:stage, self:provider.stage}

  domains:
    prod: api.ubcbiztech.com
    staging: api-staging.ubcbiztech.com
    dev: api-dev.ubcbiztech.com

  customDomain:
    domainName: ${self:custom.domains.${self:custom.stage}}
    basePath: ""
    stage: ${self:custom.stage}
    certificateName: ${self:custom.domains.${self:custom.stage}}
    createRoute53Record: true
    endpointType: edge
    apiType: rest
    autoDomain: false

  serverless-offline:
    httpPort: 4017
    lambdaPort: 5015
    websocketPort: 3005

  dynamodb:
    start:
      port: 8000
      migrate: true
      noStart: true
      convertEmptyValues: true
    stages:
      - dev

functions:
  btxGetProjects:
    handler: handler.getProjects
    events:
      - http:
          path: btx/projects
          method: get
          cors: true

  btxGetMarketSnapshot:
    handler: handler.getMarketSnapshot
    events:
      - http:
          path: btx/market/snapshot
          method: get
          cors: true

  btxPortfolio:
    handler: handler.getPortfolio
    events:
      - http:
          path: btx/portfolio
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxRecentTrades:
    handler: handler.getRecentTradesHandler
    events:
      - http:
          path: btx/trades
          method: get
          cors: true

  btxPriceHistory:
    handler: handler.getPriceHistoryHandler
    events:
      - http:
          path: btx/price-history
          method: get
          cors: true

  btxLeaderboard:
    handler: handler.getLeaderboard
    events:
      - http:
          path: btx/leaderboard
          method: get
          cors: true

  btxQuote:
    handler: handler.getQuoteHandler
    events:
      - http:
          path: btx/market/quote
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxStartSeeding:
    handler: handler.postStartSeeding
    events:
      - http:
          path: btx/projects/{projectId}/seed/start
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxIpo:
    handler: handler.postIpo
    events:
      - http:
          path: btx/admin/ipo
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxGrant:
    handler: handler.postGrant
    events:
      - http:
          path: btx/admin/grant
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxBuy:
    handler: handler.postBuy
    events:
      - http:
          path: btx/market/buy
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxSell:
    handler: handler.postSell
    events:
      - http:
          path: btx/market/sell
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxTradeStatus:
    handler: handler.getTradeStatus
    events:
      - http:
          path: btx/trades/{projectId}/{tradeId}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxAccountTrades:
    handler: handler.getAccountTrades
    events:
      - http:
          path: btx/account/trades
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:biztechApi-${file(../../serverless.common.yml):provider.stage}.CognitoAuthorizer}

  btxTradeDispatcher:
    handler: workers.enqueuePendingTrades
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [BizBtxTradesTable, StreamArn]
          startingPosition: TRIM_HORIZON
          batchSize: 1
          filterPatterns:
            - dynamodb:
                NewImage:
                  status:
                    S: [PENDING]

  btxTradeProcessor:
    handler: workers.processMarketQueue
    reservedConcurrency: 1
    events:
      - sqs:
          arn:
            Fn::GetAtt: [BtxTradeCommandsQueue, Arn]
          batchSize: 1

  btxMarketTick:
    handler: workers.marketTick
    timeout: 60
    events:
      - schedule:
          name: btx-market-tick-${self:provider.stage}
          rate: rate(1 minute)

  wsConnect:
    handler: handler.wsConnect
    events:
      - websocket:
          route: $connect

  wsDisconnect:
    handler: handler.wsDisconnect
    events:
      - websocket:
          route: $disconnect

  wsSubscribe:
    handler: handler.wsSubscribe
    events:
      - websocket:
          route: subscribe

resources:
  Resources:
    BizBtxProjectsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: bizBtxProjects${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: projectId
            AttributeType: S
          - AttributeName: eventId
            AttributeType: S
        KeySchema:
          - AttributeName: projectId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: byEvent
            KeySchema:
              - AttributeName: eventId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # Archive-only: retained so historical bizBtxAccounts rows are not deleted.
    # Application code must never read or write this table.
    BizBtxAccountsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: bizBtxAccounts${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH

    # KickStart event-scoped accounts. Deployed empty; no V1 migration.
    BizBtxEventAccountsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: bizBtxEventAccounts${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: eventId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: eventId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: byEvent
            KeySchema:
              - AttributeName: eventId
                KeyType: HASH
              - AttributeName: userId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    BizBtxHoldingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: bizBtxHoldings${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: projectId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: projectId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: byProject
            KeySchema:
              - AttributeName: projectId
                KeyType: HASH
              - AttributeName: userId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    BizBtxTradesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: bizBtxTrades${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        AttributeDefinitions:
          - AttributeName: projectId
            AttributeType: S
          - AttributeName: tradeId
            AttributeType: S
          - AttributeName: accountId
            AttributeType: S
        KeySchema:
          - AttributeName: projectId
            KeyType: HASH
          - AttributeName: tradeId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: byAccount
            KeySchema:
              - AttributeName: accountId
                KeyType: HASH
              - AttributeName: tradeId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    BizBtxSocketsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: bizBtxSockets${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: eventId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: byEvent
            KeySchema:
              - AttributeName: eventId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: byUser
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: connectionId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    BizBtxPricesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: bizBtxPrices${self:provider.environment.ENVIRONMENT}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: projectId
            AttributeType: S
          - AttributeName: ts
            AttributeType: N
        KeySchema:
          - AttributeName: projectId
            KeyType: HASH
          - AttributeName: ts
            KeyType: RANGE

    BtxTradeCommandsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: btx-trade-commands-dlq-${self:provider.stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        MessageRetentionPeriod: 1209600

    BtxTradeCommandsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: btx-trade-commands-${self:provider.stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [BtxTradeCommandsDLQ, Arn]
          maxReceiveCount: 5

    BtxTradeDlqDepthAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: btx-trade-dlq-depth-${self:provider.stage}
        AlarmDescription: BTX trade FIFO DLQ has messages
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt: [BtxTradeCommandsDLQ, QueueName]
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
