name: Lint

on:
  pull_request:
  push:
    branches: ["master", "dev"]

permissions: {}

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - run: npx eslint .

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        # Release promotions collect many dev commits by design.
        if: github.event.pull_request.head.ref != 'dev' || github.event.pull_request.base.ref != 'master'
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            for (let i = 0; i < commits.length; i++) {
              const msg = commits[i].commit.message;
              const [subject] = msg.split('\n');

              if (subject.length > 60) {
                core.setFailed(`Commit ${i + 1} subject must be ≤60 characters (got ${subject.length})`);
              }
            }
