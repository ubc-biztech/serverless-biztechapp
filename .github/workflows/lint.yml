name: Lint

on:
  pull_request:
    # Include edited so fixing a title re-runs pr-rules without a dummy commit.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["master"]

permissions: {}

jobs:
  eslint:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - run: npx eslint .

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { title, number } = context.payload.pull_request;

            // Squash merge writes the subject as "<title> (#<number>)".
            const subject = `${title} (#${number})`;
            const maxSubjectLength = 96;
            if (subject.length > maxSubjectLength) {
              core.setFailed(`Squash commit subject "${subject}" must be ≤${maxSubjectLength} characters (got ${subject.length})`);
            }
