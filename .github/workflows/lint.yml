name: Lint

on:
  pull_request:
    # edited is included so fixing a title or description re-runs pr-rules
    # without a dummy commit.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["master"]

permissions: {}

jobs:
  eslint:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - run: npx eslint .

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        # PRs are squash-merged with the title and description as the commit
        # message, so those are what get checked.
        with:
          script: |
            const { title, body, number } = context.payload.pull_request;

            // Squash merge writes the subject as "<title> (#<number>)".
            const subject = `${title} (#${number})`;
            if (subject.length > 60) {
              core.setFailed(`Squash commit subject "${subject}" must be ≤60 characters (got ${subject.length})`);
            }

            const bodyLines = (body ?? '').split(/\r?\n/);
            for (let i = 0; i < bodyLines.length; i++) {
              const line = bodyLines[i];
              if (line.length > 72) {
                core.setFailed(`PR description line ${i + 1} exceeds 72 characters: "${line.slice(0, 80)}..."`);
              }
            }
